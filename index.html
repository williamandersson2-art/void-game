<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID — Survive the Asteroid Field</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Orbitron',monospace;user-select:none}
canvas{display:block;cursor:none}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#score-wrap{position:absolute;top:28px;left:36px}
#score-label{font-size:9px;letter-spacing:.25em;color:rgba(255,255,255,.3)}
#score-val{font-size:32px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 20px rgba(0,200,255,.6)}
#lives-wrap{position:absolute;top:28px;right:36px;display:flex;gap:10px;align-items:center}
#wave-wrap{position:absolute;top:32px;left:50%;transform:translateX(-50%);text-align:center}
#wave-label{font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.2)}
#wave-val{font-size:14px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.1em}

#overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;background:rgba(0,0,0,.85);
}
.overlay-title{
  font-size:clamp(52px,11vw,108px);font-weight:900;color:#fff;
  letter-spacing:.18em;
  text-shadow:0 0 30px #0cf,0 0 80px #0cf,0 0 160px rgba(0,200,255,.4);
  margin-bottom:.3em;animation:pulse 3s ease-in-out infinite;
}
.overlay-sub{font-size:clamp(10px,1.6vw,13px);letter-spacing:.22em;color:rgba(255,255,255,.35);margin-bottom:.6em}
.overlay-hint{font-size:clamp(9px,1.2vw,11px);letter-spacing:.12em;color:rgba(255,255,255,.18);margin-bottom:3em}
.btn{
  background:transparent;border:1px solid rgba(0,200,255,.5);
  color:#0cf;font-family:'Orbitron',monospace;
  font-size:clamp(10px,1.5vw,13px);letter-spacing:.22em;
  padding:14px 48px;cursor:pointer;transition:all .25s;
  pointer-events:all;text-transform:uppercase;
}
.btn:hover{background:rgba(0,200,255,.12);border-color:#0cf;box-shadow:0 0 30px rgba(0,200,255,.25)}
.final-score{font-size:clamp(14px,2.5vw,22px);color:#0cf;letter-spacing:.2em;margin-bottom:.4em}
.best-score{font-size:10px;color:rgba(255,255,255,.25);letter-spacing:.2em;margin-bottom:3em}
@keyframes pulse{0%,100%{text-shadow:0 0 30px #0cf,0 0 80px #0cf,0 0 160px rgba(0,200,255,.4)}50%{text-shadow:0 0 20px #0cf,0 0 50px #0cf,0 0 100px rgba(0,200,255,.2)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" style="display:none">
  <div id="score-wrap">
    <div id="score-label">SCORE</div>
    <div id="score-val">0</div>
  </div>
  <div id="lives-wrap"></div>
  <div id="wave-wrap">
    <div id="wave-label">WAVE</div>
    <div id="wave-val">1</div>
  </div>
</div>

<div id="overlay">
  <div class="overlay-title">VOID</div>
  <div class="overlay-sub">SURVIVE THE ASTEROID FIELD</div>
  <div class="overlay-hint">MOVE WITH MOUSE &nbsp;·&nbsp; COLLECT ORBS &nbsp;·&nbsp; AVOID ASTEROIDS</div>
  <button class="btn" id="start-btn">LAUNCH</button>
</div>

<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
let W,H,mx,my,lastTime=0,elapsed=0;
let gameState='menu';
let score=0,hiScore=0,lives=3,wave=1;
let ship,particles=[],asteroids=[],orbs=[],stars=[],explo=[];
let aTick=0,oTick=0;
const keys={};

function resize(){
  W=C.width=window.innerWidth;
  H=C.height=window.innerHeight;
  mx=W/2;my=H/2;
  genStars();
}
function genStars(){
  stars=[];
  const n=Math.floor(W*H/7000);
  for(let i=0;i<n;i++)stars.push({
    x:Math.random()*W,y:Math.random()*H,
    r:.2+Math.random()*1.2,
    a:.08+Math.random()*.55,
    t:Math.random()*Math.PI*2,
    s:.3+Math.random()*.6
  });
}
function initShip(){
  ship={x:W/2,y:H/2,vx:0,vy:0,angle:-Math.PI/2,r:13,inv:0,trail:[]};
}

window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
window.addEventListener('touchmove',e=>{e.preventDefault();mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:false});
window.addEventListener('keydown',e=>keys[e.code]=true);
window.addEventListener('keyup',e=>keys[e.code]=false);

document.getElementById('start-btn').onclick=()=>startGame();

function startGame(){
  score=0;lives=3;wave=1;elapsed=0;aTick=0;oTick=0;
  particles=[];asteroids=[];orbs=[];explo=[];
  initShip();
  mx=W/2;my=H/2;
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  updateHUD();
  gameState='playing';
  requestAnimationFrame(loop);
}

function spawnAsteroid(){
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W;y=-60;}
  else if(edge===1){x=W+60;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+60;}
  else{x=-60;y=Math.random()*H;}
  const spd=(1+Math.random()*.9)*(1+wave*.1);
  const ang=Math.atan2((ship.y-y)+(Math.random()-.5)*300,(ship.x-x)+(Math.random()-.5)*300);
  const sides=5+Math.floor(Math.random()*4);
  const r=16+Math.random()*20;
  const verts=[];
  for(let i=0;i<sides;i++){
    const a=(i/sides)*Math.PI*2;
    verts.push({x:Math.cos(a)*r*(0.6+Math.random()*.4),y:Math.sin(a)*r*(0.6+Math.random()*.4)});
  }
  asteroids.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r,verts,rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.025});
}

function spawnOrb(){
  const m=100;
  orbs.push({x:m+Math.random()*(W-m*2),y:m+Math.random()*(H-m*2),r:7,p:Math.random()*Math.PI*2});
}

function explode(x,y,col){
  for(let i=0;i<24;i++){
    const a=Math.random()*Math.PI*2,s=.5+Math.random()*3.5;
    explo.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:1+Math.random()*3,col});
  }
}

function dst(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function updateHUD(){
  document.getElementById('score-val').textContent=score;
  document.getElementById('wave-val').textContent=wave;
  const lw=document.getElementById('lives-wrap');
  lw.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 22 22');s.setAttribute('width','19');s.setAttribute('height','19');
    const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    p.setAttribute('points','11,2 19,20 11,15 3,20');
    p.setAttribute('fill',i<lives?'#0cf':'rgba(255,255,255,.1)');
    if(i<lives)p.setAttribute('filter','drop-shadow(0 0 5px #0cf)');
    s.appendChild(p);lw.appendChild(s);
  }
}

function gameOver(){
  gameState='dead';
  if(score>hiScore)hiScore=score;
  const o=document.getElementById('overlay');
  o.style.display='flex';
  o.innerHTML=`
    <div class="overlay-title" style="font-size:clamp(36px,7vw,72px)">GAME OVER</div>
    <div class="final-score">SCORE — ${score}</div>
    <div class="best-score">BEST &nbsp;${hiScore}</div>
    <button class="btn" onclick="startGame()">RETRY</button>
  `;
}

function loop(ts){
  if(gameState!=='playing')return;
  const dt=Math.min((ts-lastTime)/1000,.05);
  lastTime=ts;
  elapsed+=dt;
  wave=Math.floor(elapsed/18)+1;

  // Clear
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  // Stars
  for(const s of stars){
    s.t+=dt*s.s;
    ctx.globalAlpha=s.a*(0.65+0.35*Math.sin(s.t));
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Keyboard
  if(keys['ArrowLeft']||keys['KeyA']){ship.vx-=.18;ship.angle=Math.atan2(ship.vy-.1,ship.vx-.1);}
  if(keys['ArrowRight']||keys['KeyD']){ship.vx+=.18;ship.angle=Math.atan2(ship.vy+.1,ship.vx+.1);}
  if(keys['ArrowUp']||keys['KeyW']){ship.vy-=.18;}
  if(keys['ArrowDown']||keys['KeyS']){ship.vy+=.18;}

  // Mouse steer
  const ddx=mx-ship.x,ddy=my-ship.y,dd=Math.hypot(ddx,ddy);
  if(dd>8){
    const pull=Math.min(dd,120)*.009;
    ship.vx+=ddx/dd*pull*dt*60;
    ship.vy+=ddy/dd*pull*dt*60;
    ship.angle=Math.atan2(ddy,ddx);
  }

  // Physics
  ship.vx*=.935;ship.vy*=.935;
  ship.x+=ship.vx*dt*60*.6;
  ship.y+=ship.vy*dt*60*.6;

  // Wrap
  if(ship.x<-30)ship.x=W+30;else if(ship.x>W+30)ship.x=-30;
  if(ship.y<-30)ship.y=H+30;else if(ship.y>H+30)ship.y=-30;

  const spd=Math.hypot(ship.vx,ship.vy);

  // Trail
  ship.trail.unshift({x:ship.x,y:ship.y,s:spd});
  if(ship.trail.length>28)ship.trail.pop();

  // Draw trail
  for(let i=0;i<ship.trail.length;i++){
    const t=ship.trail[i],frac=1-i/ship.trail.length;
    ctx.save();
    ctx.globalAlpha=frac*.35;
    ctx.shadowBlur=8;ctx.shadowColor='#0cf';
    ctx.fillStyle=`hsl(${185+i*1.5},100%,${55+frac*20}%)`;
    ctx.beginPath();ctx.arc(t.x,t.y,2.5*frac,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Spawn
  aTick+=dt;
  const aInterval=Math.max(.35,1.6-wave*.07);
  if(aTick>aInterval){aTick=0;spawnAsteroid();if(wave>3)spawnAsteroid();}
  oTick+=dt;
  if(oTick>3.8&&orbs.length<6){oTick=0;spawnOrb();}

  // Orbs
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];o.p+=dt*2.5;
    const pr=o.r+Math.sin(o.p)*2.5;
    if(dst(ship,o)<ship.r+pr+2){
      score+=10;updateHUD();
      explode(o.x,o.y,'rgba(0,255,140,1)');
      orbs.splice(i,1);continue;
    }
    ctx.save();
    // Glow ring
    ctx.globalAlpha=.18+.12*Math.sin(o.p);
    ctx.strokeStyle='#0f8';ctx.lineWidth=1;
    ctx.shadowBlur=14;ctx.shadowColor='#0f8';
    ctx.beginPath();ctx.arc(o.x,o.y,pr*2.2,0,Math.PI*2);ctx.stroke();
    // Core
    ctx.globalAlpha=.9;
    ctx.shadowBlur=18;ctx.shadowColor='#0f8';
    const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,pr*1.4);
    g.addColorStop(0,'rgba(180,255,220,1)');
    g.addColorStop(.4,'rgba(0,255,140,.8)');
    g.addColorStop(1,'rgba(0,200,100,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(o.x,o.y,pr*1.4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Asteroids
  for(let i=asteroids.length-1;i>=0;i--){
    const a=asteroids[i];
    a.x+=a.vx*dt*60*.55;a.y+=a.vy*dt*60*.55;a.rot+=a.rs;
    if(a.x<-250||a.x>W+250||a.y<-250||a.y>H+250){asteroids.splice(i,1);continue;}
    // Collision
    if(ship.inv<=0&&dst(ship,a)<ship.r+a.r*.72){
      explode(ship.x,ship.y,'rgba(255,80,80,1)');
      lives--;updateHUD();
      if(lives<=0){gameOver();return;}
      ship.inv=2.8;ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;mx=W/2;my=H/2;ship.trail=[];
    }
    // Draw
    ctx.save();
    ctx.translate(a.x,a.y);ctx.rotate(a.rot);
    ctx.shadowBlur=6;ctx.shadowColor='rgba(180,180,255,.3)';
    ctx.fillStyle='rgba(18,18,38,.85)';
    ctx.strokeStyle='rgba(160,160,220,.75)';ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(a.verts[0].x,a.verts[0].y);
    for(let j=1;j<a.verts.length;j++)ctx.lineTo(a.verts[j].x,a.verts[j].y);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
  }

  // Explosion particles
  for(let i=explo.length-1;i>=0;i--){
    const p=explo[i];
    p.x+=p.vx*dt*60*.5;p.y+=p.vy*dt*60*.5;
    p.vx*=.96;p.vy*=.96;p.life-=dt*1.8;
    if(p.life<=0){explo.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=p.life*.9;
    ctx.shadowBlur=10;ctx.shadowColor=p.col;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Ship
  if(ship.inv<=0||Math.floor(ship.inv*7)%2===0){
    ctx.save();
    ctx.translate(ship.x,ship.y);
    ctx.rotate(ship.angle+Math.PI/2);
    ctx.shadowBlur=22;ctx.shadowColor='rgba(0,200,255,.8)';
    // Body
    ctx.fillStyle='#e8f4ff';
    ctx.strokeStyle='#0cf';ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(0,-ship.r*1.1);
    ctx.lineTo(ship.r*.72,ship.r*.85);
    ctx.lineTo(0,ship.r*.38);
    ctx.lineTo(-ship.r*.72,ship.r*.85);
    ctx.closePath();ctx.fill();ctx.stroke();
    // Engine flame
    if(spd>.4){
      ctx.shadowBlur=14;ctx.shadowColor='#0cf';
      ctx.fillStyle='rgba(0,190,255,.72)';
      ctx.beginPath();
      ctx.moveTo(-ship.r*.28,ship.r*.38);
      ctx.lineTo(0,ship.r*.9+Math.random()*7);
      ctx.lineTo(ship.r*.28,ship.r*.38);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  if(ship.inv>0)ship.inv-=dt;

  // Score pulse on collect
  updateHUD();
  document.getElementById('wave-val').textContent=wave;

  requestAnimationFrame(loop);
}

// Menu background loop
function menuLoop(ts){
  if(gameState!=='menu')return;
  lastTime=ts;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.t+=.003;
    ctx.globalAlpha=s.a*(0.65+0.35*Math.sin(s.t));
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(menuLoop);
}

resize();
requestAnimationFrame(menuLoop);
</script>
</body>
</html>
