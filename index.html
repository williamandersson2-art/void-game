<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Orbitron',monospace;user-select:none}
canvas{display:block}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#score-block{position:absolute;top:22px;left:28px}
.lbl{font-size:8px;letter-spacing:.28em;color:rgba(255,255,255,.22)}
.val{font-size:28px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 16px #0cf}
.sub{font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.12em;margin-top:3px}
#wave-block{position:absolute;top:22px;left:50%;transform:translateX(-50%);text-align:center}
#lives-block{position:absolute;top:22px;right:28px;display:flex;gap:8px;align-items:center}
#boss-bar{position:absolute;top:72px;left:50%;transform:translateX(-50%);width:min(400px,80vw);display:none}
#boss-lbl{font-size:8px;letter-spacing:.2em;color:rgba(255,80,80,.6);text-align:center;margin-bottom:5px}
#boss-bg{height:4px;background:rgba(255,255,255,.08);border-radius:2px}
#boss-fill{height:4px;background:linear-gradient(90deg,#f00,#f80);border-radius:2px;width:100%;transition:width .1s}
#upgrades-bar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:92vw}
.pip{border:1px solid;padding:3px 9px;font-size:7px;letter-spacing:.15em;border-radius:2px}
#ann{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(20px,4vw,36px);font-weight:900;letter-spacing:.22em;color:#fff;text-shadow:0 0 28px #0cf;opacity:0;pointer-events:none;text-align:center}
#orb-hint{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.18em;color:rgba(255,255,255,.18)}
#ctrl{position:absolute;bottom:22px;right:28px;font-size:7px;letter-spacing:.12em;color:rgba(255,255,255,.14);line-height:2;text-align:right}

.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#ov-menu{background:rgba(0,0,0,.82)}
#ov-dead{background:rgba(0,0,0,.9);display:none}
#ov-upg{background:rgba(0,0,0,.93);display:none}
#ov-boss{background:rgba(0,0,0,.88);display:none}

.big{font-size:clamp(50px,11vw,110px);font-weight:900;letter-spacing:.18em;color:#fff;text-shadow:0 0 28px #0cf,0 0 80px #0cf;animation:gl 3s ease-in-out infinite;margin-bottom:.25em}
@keyframes gl{0%,100%{opacity:1}50%{opacity:.65}}
.hint{font-size:clamp(8px,1.3vw,11px);letter-spacing:.2em;color:rgba(255,255,255,.28);margin-bottom:.5em}
.hint2{font-size:clamp(7px,1.1vw,9px);letter-spacing:.14em;color:rgba(255,255,255,.15);margin-bottom:2.6em;line-height:2;text-align:center}
.btn{background:transparent;border:1px solid rgba(0,200,255,.45);color:#0cf;font-family:'Orbitron',monospace;font-size:clamp(9px,1.3vw,12px);letter-spacing:.22em;padding:12px 44px;cursor:pointer;transition:all .2s;pointer-events:all;margin:6px}
.btn:hover{background:rgba(0,200,255,.1);box-shadow:0 0 24px rgba(0,200,255,.2)}
.fin{font-size:clamp(18px,3vw,28px);color:#0cf;letter-spacing:.18em;margin-bottom:.3em}
.fin2{font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.22);margin-bottom:2.4em}
.nb{font-size:10px;letter-spacing:.22em;color:#ff0;margin-bottom:2.4em;animation:gl .9s ease-in-out infinite}

.upg-ttl{font-size:clamp(10px,1.6vw,13px);letter-spacing:.22em;color:rgba(255,255,255,.35);margin-bottom:1.8em}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:820px;padding:0 20px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);padding:20px 16px;cursor:pointer;transition:all .18s;pointer-events:all;width:168px;text-align:center;position:relative;border-radius:2px}
.card:hover{background:rgba(255,255,255,.07);transform:translateY(-4px)}
.card-icon{font-size:26px;margin-bottom:9px;display:block}
.card-name{font-size:10px;font-weight:700;letter-spacing:.18em;margin-bottom:7px}
.card-desc{font-size:8px;letter-spacing:.09em;color:rgba(255,255,255,.38);line-height:1.8}
.card-lvl{position:absolute;top:7px;right:9px;font-size:7px;color:rgba(255,255,255,.22)}

.boss-name{font-size:clamp(26px,5vw,50px);font-weight:900;letter-spacing:.2em;color:#f44;text-shadow:0 0 28px #f00;margin-bottom:.4em}
.boss-sub{font-size:clamp(8px,1.3vw,11px);letter-spacing:.2em;color:rgba(255,100,100,.5);margin-bottom:2.4em}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" style="display:none">
  <div id="score-block">
    <div class="lbl">SCORE</div><div class="val" id="hS">0</div>
    <div class="lbl" style="margin-top:4px">BEST</div><div class="sub" id="hB">0</div>
  </div>
  <div id="wave-block"><div class="lbl">WAVE</div><div class="val" id="hW">1</div></div>
  <div id="lives-block" id="hL"></div>
  <div id="boss-bar"><div id="boss-lbl">BOSS HP</div><div id="boss-bg"><div id="boss-fill"></div></div></div>
  <div id="ann"></div>
  <div id="orb-hint"></div>
  <div id="upgrades-bar"></div>
  <div id="ctrl">A/D · ROTATE &nbsp; W · THRUST<br>S · BRAKE &nbsp; SPACE · SHOOT</div>
</div>

<div class="ov" id="ov-menu">
  <div class="big">VOID</div>
  <div class="hint">SURVIVE THE ASTEROID FIELD</div>
  <div class="hint2">A / D · ROTATE &nbsp;·&nbsp; W · THRUST FORWARD &nbsp;·&nbsp; S · BRAKE<br>COLLECT ORBS → UPGRADE EVERY 5 · BOSS EVERY 5 WAVES</div>
  <button class="btn" onclick="startGame()">LAUNCH</button>
</div>

<div class="ov" id="ov-dead">
  <div class="big" style="font-size:clamp(32px,7vw,70px)">GAME OVER</div>
  <div class="fin" id="goS"></div>
  <div class="fin2" id="goB"></div>
  <div class="nb" id="goN" style="display:none">✦ NEW BEST ✦</div>
  <button class="btn" onclick="startGame()">RETRY</button>
</div>

<div class="ov" id="ov-upg">
  <div class="upg-ttl">— CHOOSE AN UPGRADE —</div>
  <div class="cards" id="upg-cards"></div>
</div>

<div class="ov" id="ov-boss">
  <div class="boss-name" id="bName"></div>
  <div class="boss-sub" id="bSub"></div>
  <button class="btn" style="border-color:rgba(255,60,60,.5);color:#f44" onclick="startBoss()">ENGAGE</button>
</div>

<script>
// ─── SETUP ────────────────────────────────────────────────────────────────
const CV = document.getElementById('c');
const cx = CV.getContext('2d');
let W, H;

function resize() {
  W = CV.width  = window.innerWidth;
  H = CV.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ─── INPUT ────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); shoot(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') dash();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── GAME VARS ────────────────────────────────────────────────────────────
let state = 'menu'; // menu | playing | boss | upgrade | boss-intro | dead
let score, wave, lives, orbCount, hiScore, elapsed;
let ship, asteroids, orbs, bullets, particles, boss;
let spawnTick, orbTick, bossAtkTick, annTimer, shootCd, dashCd;
let upgrades = {};
let stars = [];

hiScore = +localStorage.getItem('void-hi') || 0;

// ─── STARS ────────────────────────────────────────────────────────────────
function genStars() {
  stars = [];
  for (let i = 0; i < (W * H / 6500) | 0; i++)
    stars.push({ x: Math.random()*W, y: Math.random()*H, r: .15 + Math.random()*1.3, a: .06 + Math.random()*.55, t: Math.random()*Math.PI*2, s: .2+Math.random()*.55 });
}
genStars();
window.addEventListener('resize', genStars);

// ─── UPGRADES ─────────────────────────────────────────────────────────────
const UPGRADES = [
  {id:'shield',   name:'SHIELD',    icon:'⬡', col:'#c0f', desc:'Absorbs 1 hit, stackable',    max:3},
  {id:'velocity', name:'VELOCITY',  icon:'▶', col:'#ff0', desc:'Rotate & thrust +20%',        max:5},
  {id:'bounty',   name:'BOUNTY',    icon:'◆', col:'#0f8', desc:'Orbs worth +10pts each',      max:3},
  {id:'frost',    name:'FROST',     icon:'✦', col:'#8df', desc:'Asteroids 16% slower',        max:4},
  {id:'magnet',   name:'MAGNET',    icon:'◎', col:'#0cf', desc:'Orbs attracted to you',       max:1},
  {id:'turret',   name:'TURRET',    icon:'▲', col:'#f80', desc:'SPACE to shoot',              max:1},
  {id:'repair',   name:'REPAIR',    icon:'♥', col:'#f55', desc:'+1 life now',                 max:99},
  {id:'ghost',    name:'GHOST',     icon:'◌', col:'#aaf', desc:'+1.5s invincibility',         max:3},
  {id:'rapidfire',name:'RAPID',     icon:'⚡', col:'#ff8', desc:'Shoot 50% faster',           max:3},
  {id:'spread',   name:'SPREAD',    icon:'≋', col:'#fa0', desc:'3-bullet spread shot',        max:1},
  {id:'homing',   name:'HOMING',    icon:'⟳', col:'#f0f', desc:'Bullet seeks nearest enemy', max:1},
  {id:'overclock',name:'OVERCLOCK', icon:'⬥', col:'#0ff', desc:'+15% all score',             max:4},
  {id:'afterburn',name:'AFTERBURN', icon:'🔥', col:'#f84', desc:'SHIFT to dash (3s cd)',      max:1},
  {id:'mirror',   name:'MIRROR',    icon:'⇌', col:'#8f8', desc:'Orbs spawn a clone',         max:1},
];
function upg(id) { return upgrades[id] || 0; }

// ─── BOSSES ───────────────────────────────────────────────────────────────
const BOSSES = [
  {name:'THE DRIFTER',   sub:'A slow beast. More hull than brain.',  hp:18, spd:.5,  col:'#f44', atk:2.2, sz:52},
  {name:'RAMPART',       sub:'Charges hard. Leaves no room.',        hp:30, spd:.75, col:'#f80', atk:1.7, sz:62},
  {name:'VOID HERALD',   sub:'Splits and multiplies.',               hp:42, spd:.6,  col:'#c0f', atk:1.4, sz:70},
  {name:'ANNIHILATOR',   sub:'Shoots back. Faster. Angrier.',        hp:58, spd:.85, col:'#f00', atk:1.0, sz:78},
  {name:'OBLIVION CORE', sub:'It knows where you are going.',        hp:75, spd:1.0, col:'#ff0', atk:.7,  sz:86},
];

// ─── HELPERS ──────────────────────────────────────────────────────────────
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function addScore(n) {
  score += Math.round(n * (1 + upg('overclock') * .15));
  refreshHUD();
}
function announce(txt) {
  const el = document.getElementById('ann');
  el.textContent = txt; el.style.opacity = '1';
  annTimer = 2;
}

// ─── HUD ──────────────────────────────────────────────────────────────────
function refreshHUD() {
  document.getElementById('hS').textContent = score;
  document.getElementById('hB').textContent = hiScore;
  document.getElementById('hW').textContent = wave;

  // Lives
  const lw = document.getElementById('lives-block');
  lw.innerHTML = '';
  for (let i = 0; i < lives; i++) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 22 22'); svg.setAttribute('width','16'); svg.setAttribute('height','16');
    const p = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    p.setAttribute('points','11,2 19,20 11,15 3,20'); p.setAttribute('fill','#0cf');
    p.setAttribute('filter','drop-shadow(0 0 4px #0cf)');
    svg.appendChild(p); lw.appendChild(svg);
  }
  for (let i = 0; i < ship.shieldHp; i++) {
    const d = document.createElement('div');
    d.style.cssText = 'width:6px;height:6px;border-radius:50%;background:#c0f;box-shadow:0 0 8px #c0f;align-self:center';
    lw.appendChild(d);
  }

  // Upgrades bar
  const ub = document.getElementById('upgrades-bar'); ub.innerHTML = '';
  for (const [id, lvl] of Object.entries(upgrades)) {
    if (!lvl || id === 'repair') continue;
    const def = UPGRADES.find(u => u.id === id); if (!def) continue;
    const pip = document.createElement('div'); pip.className = 'pip';
    pip.style.color = def.col; pip.style.borderColor = def.col + '44';
    pip.textContent = def.icon + ' ' + def.name + (lvl > 1 ? ' ' + lvl : '');
    ub.appendChild(pip);
  }

  document.getElementById('orb-hint').textContent = 'ORB ' + (orbCount % 5) + '/5 → UPGRADE';
}

// ─── SHOOT / DASH ─────────────────────────────────────────────────────────
function shoot() {
  if (!upg('turret') || (state !== 'playing' && state !== 'boss') || shootCd > 0) return;
  const baseCd = .45 * (1 - .5 * upg('rapidfire') / 3);
  shootCd = baseCd;
  const angles = upg('spread') ? [-0.28, 0, 0.28] : [0];
  for (const da of angles) {
    const a = ship.angle + da;
    bullets.push({ x: ship.x, y: ship.y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, life: 1, homing: da === 0 && !!upg('homing') });
  }
}
function dash() {
  if (!upg('afterburn') || (state !== 'playing' && state !== 'boss') || dashCd > 0) return;
  dashCd = 3;
  ship.x += Math.cos(ship.angle) * 130;
  ship.y += Math.sin(ship.angle) * 130;
  ship.dashing = true;
  setTimeout(() => { ship.dashing = false; }, 200);
}

// ─── SPAWN ────────────────────────────────────────────────────────────────
function spawnAsteroid() {
  const edge = Math.random() * 4 | 0;
  let x, y;
  if (edge === 0) { x = Math.random() * W; y = -60; }
  else if (edge === 1) { x = W + 60; y = Math.random() * H; }
  else if (edge === 2) { x = Math.random() * W; y = H + 60; }
  else { x = -60; y = Math.random() * H; }
  const slow = 1 - upg('frost') * .16;
  const spd  = (1 + Math.random() * .9) * (1 + wave * .09) * slow;
  const ang  = Math.atan2(ship.y - y + (Math.random()-.5)*300, ship.x - x + (Math.random()-.5)*300);
  const r    = 14 + Math.random() * 22;
  const sides = 5 + Math.random() * 4 | 0;
  const verts = [];
  for (let i = 0; i < sides; i++) {
    const a = i / sides * Math.PI * 2;
    verts.push({ x: Math.cos(a)*r*(.55+Math.random()*.45), y: Math.sin(a)*r*(.55+Math.random()*.45) });
  }
  asteroids.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, r, verts, rot: Math.random()*Math.PI*2, rs: (Math.random()-.5)*.028 });
}
function spawnOrb(ox, oy) {
  const m = 90;
  orbs.push({ x: ox ?? m + Math.random()*(W-m*2), y: oy ?? m + Math.random()*(H-m*2), r: 7, p: Math.random()*Math.PI*2 });
}
function burst(x, y, col, n = 20) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, s = .5 + Math.random()*4;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, r: 1+Math.random()*3, col });
  }
}

// ─── HIT PLAYER ───────────────────────────────────────────────────────────
function hitPlayer() {
  burst(ship.x, ship.y, 'rgba(255,80,80,1)');
  if (ship.shieldHp > 0) { ship.shieldHp--; burst(ship.x, ship.y, 'rgba(200,0,255,.8)', 10); }
  else { lives--; refreshHUD(); if (lives <= 0) { gameOver(); return; } }
  ship.inv = 2.5 + upg('ghost') * 1.5;
  ship.x = W/2; ship.y = H/2; ship.vx = 0; ship.vy = 0; ship.trail = [];
}

// ─── GAME OVER ────────────────────────────────────────────────────────────
function gameOver() {
  state = 'dead';
  const isNew = score > hiScore;
  if (isNew) { hiScore = score; localStorage.setItem('void-hi', hiScore); }
  document.getElementById('goS').textContent = 'SCORE — ' + score;
  document.getElementById('goB').textContent = 'BEST — ' + hiScore;
  document.getElementById('goN').style.display = isNew ? 'block' : 'none';
  document.getElementById('ov-dead').style.display = 'flex';
}

// ─── UPGRADE SCREEN ───────────────────────────────────────────────────────
function showUpgrades() {
  state = 'upgrade';
  document.getElementById('ov-upg').style.display = 'flex';
  const pool = UPGRADES.filter(u => (upgrades[u.id]||0) < u.max).sort(() => Math.random()-.5).slice(0,4);
  const grid = document.getElementById('upg-cards'); grid.innerHTML = '';
  for (const u of pool) {
    const lvl = (upgrades[u.id]||0) + 1;
    const card = document.createElement('div'); card.className = 'card';
    card.style.borderColor = u.col + '38';
    card.innerHTML = `${lvl>1?`<div class="card-lvl">LVL ${lvl}</div>`:''}<span class="card-icon" style="color:${u.col};text-shadow:0 0 10px ${u.col}">${u.icon}</span><div class="card-name" style="color:${u.col}">${u.name}</div><div class="card-desc">${u.desc}</div>`;
    card.onclick = () => pickUpgrade(u.id);
    grid.appendChild(card);
  }
}
function pickUpgrade(id) {
  upgrades[id] = (upgrades[id]||0) + 1;
  if (id === 'repair') lives = Math.min(lives + 1, 8);
  if (id === 'shield') ship.shieldHp++;
  document.getElementById('ov-upg').style.display = 'none';
  refreshHUD();
  state = 'playing';
  requestAnimationFrame(loop);
}

// ─── BOSS ─────────────────────────────────────────────────────────────────
function showBossIntro() {
  state = 'boss-intro';
  const def = BOSSES[Math.min(Math.floor(wave/5)-1, BOSSES.length-1)];
  document.getElementById('bName').textContent = def.name;
  document.getElementById('bSub').textContent  = def.sub;
  document.getElementById('ov-boss').style.display = 'flex';
}
function startBoss() {
  document.getElementById('ov-boss').style.display = 'none';
  const def = BOSSES[Math.min(Math.floor(wave/5)-1, BOSSES.length-1)];
  asteroids = []; orbs = [];
  const sides = 7 + Math.min(wave/5|0, 4);
  const verts = [];
  for (let i = 0; i < sides; i++) {
    const a = i/sides*Math.PI*2;
    verts.push({ x: Math.cos(a)*def.sz*(.7+Math.random()*.35), y: Math.sin(a)*def.sz*(.7+Math.random()*.35) });
  }
  boss = { x: W/2, y: -def.sz*2, hp: def.hp, maxHp: def.hp, spd: def.spd, r: def.sz, verts, rot:0, rs:.008, col: def.col, atk: def.atk, phase:1, atkTick:0 };
  document.getElementById('boss-bar').style.display = 'block';
  bossAtkTick = 0;
  announce('BOSS INCOMING');
  state = 'boss';
  requestAnimationFrame(loop);
}
function damageBoss(d) {
  boss.hp -= d;
  burst(boss.x+(Math.random()-.5)*boss.r, boss.y+(Math.random()-.5)*boss.r, boss.col+'cc', 8);
  if (boss.hp < boss.maxHp*.5 && boss.phase === 1) { boss.phase = 2; announce('PHASE 2!'); }
  document.getElementById('boss-fill').style.width = Math.max(0, boss.hp/boss.maxHp*100) + '%';
  if (boss.hp <= 0) {
    burst(boss.x, boss.y, boss.col, 60); burst(boss.x, boss.y, 'rgba(255,255,255,.9)', 30);
    addScore(200 + wave*15);
    boss = null;
    document.getElementById('boss-bar').style.display = 'none';
    wave++; refreshHUD(); announce('BOSS DEFEATED!');
    state = 'playing';
    showUpgrades();
  }
}

// ─── START ────────────────────────────────────────────────────────────────
function startGame() {
  score = 0; wave = 1; lives = 3; orbCount = 0; elapsed = 0;
  spawnTick = 0; orbTick = 0; shootCd = 0; dashCd = 0; annTimer = 0;
  upgrades = {}; asteroids = []; orbs = []; bullets = []; particles = []; boss = null;
  ship = { x: W/2, y: H/2, vx:0, vy:0, angle: -Math.PI/2, r:13, inv:0, shieldHp:0, trail:[], dashing:false };
  document.getElementById('ov-menu').style.display = 'none';
  document.getElementById('ov-dead').style.display = 'none';
  document.getElementById('ov-upg').style.display  = 'none';
  document.getElementById('ov-boss').style.display  = 'none';
  document.getElementById('boss-bar').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  refreshHUD(); state = 'playing';
  lastT = performance.now();
  requestAnimationFrame(loop);
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────
let lastT = 0;
function loop(now) {
  if (state !== 'playing' && state !== 'boss') return;
  const dt = Math.min((now - lastT) / 1000, .05);
  lastT = now;
  elapsed += dt;
  if (shootCd > 0) shootCd -= dt;
  if (dashCd  > 0) dashCd  -= dt;
  if (annTimer > 0) {
    annTimer -= dt;
    document.getElementById('ann').style.opacity = Math.min(1, annTimer/.5);
    if (annTimer <= 0) document.getElementById('ann').style.opacity = '0';
  }

  // Wave progression (only in playing mode)
  if (state === 'playing') {
    const nw = Math.floor(elapsed/20) + 1;
    if (nw > wave) { wave = nw; refreshHUD(); announce('WAVE ' + wave); }
  }

  // ── CLEAR + BG
  cx.fillStyle = '#000'; cx.fillRect(0,0,W,H);
  const tier = Math.floor(wave/5);
  if (tier > 0) {
    const cols = ['','rgba(70,0,110,','rgba(110,36,0,','rgba(110,0,0,','rgba(90,90,0,'];
    const g = cx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.7);
    g.addColorStop(0, (cols[Math.min(tier,4)]||cols[4])+'0.07)'); g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle = g; cx.fillRect(0,0,W,H);
  }

  // ── STARS
  for (const s of stars) {
    s.t += dt * s.s;
    cx.globalAlpha = s.a * (.6 + .4*Math.sin(s.t));
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2); cx.fill();
  }
  cx.globalAlpha = 1;

  // ══════════════════════════════════════════════════════════
  // SHIP MOVEMENT  —  A/D rotate,  W thrust forward,  S brake
  // Simple, direct, nothing can interfere.
  // ══════════════════════════════════════════════════════════
  const vMult  = 1 + upg('velocity') * .2;
  const rotSpd = 0.065 * vMult;          // radians per frame
  const thrust  = 5 * vMult;             // pixels per frame when W held

  if (keys['KeyA'] || keys['ArrowLeft'])  ship.angle -= rotSpd * dt * 60;
  if (keys['KeyD'] || keys['ArrowRight']) ship.angle += rotSpd * dt * 60;

  if (keys['KeyW'] || keys['ArrowUp']) {
    ship.x += Math.cos(ship.angle) * thrust * dt * 60;
    ship.y += Math.sin(ship.angle) * thrust * dt * 60;
  }
  if (keys['KeyS'] || keys['ArrowDown']) {
    ship.x -= Math.cos(ship.angle) * thrust * .5 * dt * 60;
    ship.y -= Math.sin(ship.angle) * thrust * .5 * dt * 60;
  }

  // Screen wrap
  if (ship.x < -30) ship.x = W+30; else if (ship.x > W+30) ship.x = -30;
  if (ship.y < -30) ship.y = H+30; else if (ship.y > H+30) ship.y = -30;

  // Speed for engine flame visual
  const px = ship.trail[0]?.x ?? ship.x, py = ship.trail[0]?.y ?? ship.y;
  const spd = Math.hypot(ship.x - px, ship.y - py) / Math.max(dt*60,.001) * .5;
  // ══════════════════════════════════════════════════════════

  // ── TRAIL
  ship.trail.unshift({x:ship.x, y:ship.y});
  if (ship.trail.length > 28) ship.trail.pop();
  for (let i = 0; i < ship.trail.length; i++) {
    const t = ship.trail[i], f = 1 - i/ship.trail.length;
    cx.globalAlpha = f * .28; cx.shadowBlur = 5; cx.shadowColor = '#0cf';
    cx.fillStyle = '#0cf'; cx.beginPath(); cx.arc(t.x,t.y,2.5*f,0,Math.PI*2); cx.fill();
  }
  cx.globalAlpha = 1; cx.shadowBlur = 0;

  // ── SPAWN
  if (state === 'playing') {
    spawnTick += dt;
    const interval = Math.max(.28, 1.5 - wave*.06);
    if (spawnTick > interval) { spawnTick = 0; spawnAsteroid(); if (wave>3) spawnAsteroid(); if (wave>7) spawnAsteroid(); }
    orbTick += dt;
    if (orbTick > 3.2 && orbs.length < 8) { orbTick = 0; spawnOrb(); }
  }

  // ── ORBS
  for (let i = orbs.length-1; i >= 0; i--) {
    const o = orbs[i]; o.p += dt * 2.5;
    if (upg('magnet')) {
      const d = dist(ship,o);
      if (d < 220) { o.x += (ship.x-o.x)/d * 12*dt*60*.05; o.y += (ship.y-o.y)/d * 12*dt*60*.05; }
    }
    const pr = o.r + Math.sin(o.p)*2.4;
    if (dist(ship,o) < ship.r + pr + 2) {
      addScore(10 + upg('bounty')*10); orbCount++;
      burst(o.x,o.y,'rgba(0,255,140,1)',16);
      if (upg('mirror')) spawnOrb(o.x+(Math.random()-.5)*80, o.y+(Math.random()-.5)*80);
      orbs.splice(i,1);
      if (orbCount % 5 === 0) { showUpgrades(); return; }
      continue;
    }
    // draw
    cx.save(); cx.globalAlpha=.15+.1*Math.sin(o.p); cx.strokeStyle='#0f8'; cx.lineWidth=1; cx.shadowBlur=11; cx.shadowColor='#0f8';
    cx.beginPath(); cx.arc(o.x,o.y,pr*2.1,0,Math.PI*2); cx.stroke();
    cx.globalAlpha=.9; cx.shadowBlur=17; cx.shadowColor='#0f8';
    const g2 = cx.createRadialGradient(o.x,o.y,0,o.x,o.y,pr*1.5);
    g2.addColorStop(0,'rgba(180,255,215,1)'); g2.addColorStop(.4,'rgba(0,255,130,.8)'); g2.addColorStop(1,'rgba(0,200,100,0)');
    cx.fillStyle=g2; cx.beginPath(); cx.arc(o.x,o.y,pr*1.5,0,Math.PI*2); cx.fill(); cx.restore();
  }

  // ── BULLETS
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (b.homing) {
      const targets = boss ? [boss, ...asteroids] : asteroids;
      let near = null, nearD = Infinity;
      for (const t of targets) { const d=dist(b,t); if(d<nearD){nearD=d;near=t;} }
      if (near) { const a=Math.atan2(near.y-b.y,near.x-b.x); b.vx+=(Math.cos(a)*12-b.vx)*.09; b.vy+=(Math.sin(a)*12-b.vy)*.09; }
    }
    b.x += b.vx*dt*60*.5; b.y += b.vy*dt*60*.5; b.life -= dt*1.1;
    if (b.life<=0||b.x<-10||b.x>W+10||b.y<-10||b.y>H+10) { bullets.splice(i,1); continue; }
    let hit = false;
    if (boss && dist(b,boss) < boss.r*.75) { damageBoss(1); bullets.splice(i,1); hit=true; }
    if (!hit) for (let j=asteroids.length-1; j>=0; j--) {
      if (dist(b,asteroids[j]) < asteroids[j].r*.78) {
        burst(asteroids[j].x,asteroids[j].y,'rgba(180,180,255,.8)',12);
        addScore(5); asteroids.splice(j,1); bullets.splice(i,1); hit=true; break;
      }
    }
    if (hit) { if(state==='dead')return; continue; }
    cx.save(); cx.globalAlpha=b.life*.9; cx.shadowBlur=11; cx.shadowColor='#f80'; cx.fillStyle='#ffa030';
    cx.beginPath(); cx.arc(b.x,b.y,3.2,0,Math.PI*2); cx.fill(); cx.restore();
  }

  // ── BOSS UPDATE
  if (state === 'boss' && boss) {
    const a = Math.atan2(ship.y-boss.y, ship.x-boss.x);
    const sp = boss.spd * (boss.phase===2 ? 1.4:1);
    boss.x += Math.cos(a)*sp*dt*60*.5; boss.y += Math.sin(a)*sp*dt*60*.5; boss.rot += boss.rs;
    bossAtkTick += dt;
    const atkInt = boss.atk * (boss.phase===2?.55:1);
    if (bossAtkTick > atkInt) {
      bossAtkTick = 0;
      const count = boss.phase===2 ? 6:3;
      for (let i=0; i<count; i++) {
        const aa = a + (Math.random()-.5)*(boss.phase===2?1.4:.8), r=10+Math.random()*8, sp2=2.5+Math.random()*1.5;
        const verts=[]; const s2=5+Math.random()*3|0;
        for(let j=0;j<s2;j++){const ang2=j/s2*Math.PI*2;verts.push({x:Math.cos(ang2)*r*(.6+Math.random()*.4),y:Math.sin(ang2)*r*(.6+Math.random()*.4)});}
        asteroids.push({x:boss.x,y:boss.y,vx:Math.cos(aa)*sp2,vy:Math.sin(aa)*sp2,r,verts,rot:0,rs:(Math.random()-.5)*.05});
      }
    }
    if (ship.inv<=0 && dist(ship,boss)<ship.r+boss.r*.55) { hitPlayer(); if(state==='dead')return; }
    // draw boss
    cx.save(); cx.translate(boss.x,boss.y); cx.rotate(boss.rot);
    cx.shadowBlur=28; cx.shadowColor=boss.col; cx.fillStyle='rgba(8,0,0,.92)'; cx.strokeStyle=boss.col; cx.lineWidth=2.5;
    cx.beginPath(); cx.moveTo(boss.verts[0].x,boss.verts[0].y);
    for(let j=1;j<boss.verts.length;j++) cx.lineTo(boss.verts[j].x,boss.verts[j].y);
    cx.closePath(); cx.fill(); cx.stroke();
    if(boss.phase===2){cx.globalAlpha=.22+.14*Math.sin(elapsed*8);cx.fillStyle=boss.col;cx.beginPath();cx.arc(0,0,boss.r*.45,0,Math.PI*2);cx.fill();}
    cx.restore();
  }

  // ── ASTEROIDS
  for (let i=asteroids.length-1; i>=0; i--) {
    const a = asteroids[i];
    a.x+=a.vx*dt*60*.52; a.y+=a.vy*dt*60*.52; a.rot+=a.rs;
    if (a.x<-280||a.x>W+280||a.y<-280||a.y>H+280) { asteroids.splice(i,1); continue; }
    if (ship.inv<=0 && dist(ship,a)<ship.r+a.r*.7) { hitPlayer(); if(state==='dead')return; }
    cx.save(); cx.translate(a.x,a.y); cx.rotate(a.rot);
    cx.shadowBlur=4; cx.shadowColor='rgba(140,140,200,.28)'; cx.fillStyle='rgba(12,12,30,.9)'; cx.strokeStyle='rgba(140,140,200,.68)'; cx.lineWidth=1.1;
    cx.beginPath(); cx.moveTo(a.verts[0].x,a.verts[0].y);
    for(let j=1;j<a.verts.length;j++) cx.lineTo(a.verts[j].x,a.verts[j].y);
    cx.closePath(); cx.fill(); cx.stroke(); cx.restore();
  }

  // ── PARTICLES
  for (let i=particles.length-1; i>=0; i--) {
    const p=particles[i];
    p.x+=p.vx*dt*60*.45; p.y+=p.vy*dt*60*.45; p.vx*=.96; p.vy*=.96; p.life-=dt*1.7;
    if(p.life<=0){particles.splice(i,1);continue;}
    cx.save(); cx.globalAlpha=p.life*.85; cx.shadowBlur=8; cx.shadowColor=p.col; cx.fillStyle=p.col;
    cx.beginPath(); cx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); cx.fill(); cx.restore();
  }

  // ── SHIP DRAW
  const blinking = ship.inv>0 && Math.floor(ship.inv*8)%2===0;
  if (!blinking) {
    cx.save(); cx.translate(ship.x,ship.y); cx.rotate(ship.angle+Math.PI/2);
    if(ship.shieldHp>0){
      cx.save(); cx.globalAlpha=.3+.2*Math.sin(elapsed*5); cx.strokeStyle='#c0f'; cx.lineWidth=1.5; cx.shadowBlur=14; cx.shadowColor='#c0f';
      cx.beginPath(); cx.arc(0,0,ship.r*1.75,0,Math.PI*2); cx.stroke(); cx.restore();
    }
    if(ship.dashing){
      cx.save(); cx.globalAlpha=.4; cx.strokeStyle='#0cf'; cx.lineWidth=2; cx.shadowBlur=20; cx.shadowColor='#0cf';
      cx.beginPath(); cx.arc(0,0,ship.r*2.4,0,Math.PI*2); cx.stroke(); cx.restore();
    }
    cx.shadowBlur=20; cx.shadowColor='#0cf';
    cx.fillStyle='#e8f4ff'; cx.strokeStyle='#0cf'; cx.lineWidth=1.4;
    cx.beginPath(); cx.moveTo(0,-ship.r*1.1); cx.lineTo(ship.r*.72,ship.r*.85); cx.lineTo(0,ship.r*.38); cx.lineTo(-ship.r*.72,ship.r*.85); cx.closePath();
    cx.fill(); cx.stroke();
    // Engine flame when moving
    if ((keys['KeyW']||keys['ArrowUp']) && !ship.dashing) {
      cx.shadowBlur=13; cx.shadowColor='#0cf'; cx.fillStyle='rgba(0,185,255,.7)';
      cx.beginPath(); cx.moveTo(-ship.r*.26,ship.r*.38); cx.lineTo(0,ship.r*.95+Math.random()*8); cx.lineTo(ship.r*.26,ship.r*.38); cx.closePath(); cx.fill();
    }
    cx.restore();
  }
  if(ship.inv>0) ship.inv-=dt;

  // Turret aim line
  if(upg('turret')&&!blinking){
    cx.save(); cx.globalAlpha=.15; cx.strokeStyle='#f80'; cx.lineWidth=1; cx.setLineDash([4,9]);
    cx.beginPath(); cx.moveTo(ship.x,ship.y); cx.lineTo(ship.x+Math.cos(ship.angle)*320,ship.y+Math.sin(ship.angle)*320); cx.stroke(); cx.restore();
  }

  requestAnimationFrame(loop);
}

// ── MENU BG ──────────────────────────────────────────────────────────────
function menuLoop(now) {
  if (state !== 'menu') return;
  lastT = now;
  cx.fillStyle='#000'; cx.fillRect(0,0,W,H);
  for(const s of stars){s.t+=.0022;cx.globalAlpha=s.a*(.62+.38*Math.sin(s.t));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fill();}
  cx.globalAlpha=1;
  requestAnimationFrame(menuLoop);
}

document.getElementById('hB').textContent = hiScore;
requestAnimationFrame(menuLoop);
</script>
</body>
</html>
