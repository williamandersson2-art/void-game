<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID — Survive the Asteroid Field</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Orbitron',monospace;user-select:none}
canvas{display:block;cursor:none}

#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#score-wrap{position:absolute;top:26px;left:34px}
#score-label{font-size:9px;letter-spacing:.25em;color:rgba(255,255,255,.28)}
#score-val{font-size:30px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 18px rgba(0,200,255,.6)}
#hi-wrap{position:absolute;top:26px;left:34px;margin-top:52px}
#hi-label{font-size:8px;letter-spacing:.2em;color:rgba(255,255,255,.18)}
#hi-val{font-size:13px;font-weight:400;color:rgba(255,255,255,.3);letter-spacing:.1em}
#wave-wrap{position:absolute;top:30px;left:50%;transform:translateX(-50%);text-align:center}
#wave-label{font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.2)}
#wave-val{font-size:15px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.08em}
#lives-wrap{position:absolute;top:26px;right:34px;display:flex;gap:9px;align-items:center}
#upgrades-wrap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.upg-pip{
  border:1px solid;padding:4px 10px;font-size:8px;letter-spacing:.18em;
  border-radius:2px;white-space:nowrap;
}
#controls-hint{position:absolute;bottom:24px;right:34px;font-size:8px;letter-spacing:.12em;color:rgba(255,255,255,.15);line-height:1.8;text-align:right}

/* OVERLAYS */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#menu-overlay{background:rgba(0,0,0,.82)}
#gameover-overlay{background:rgba(0,0,0,.88);display:none}
#upgrade-overlay{background:rgba(0,0,0,.92);display:none}

.big-title{font-size:clamp(52px,11vw,110px);font-weight:900;color:#fff;letter-spacing:.18em;text-shadow:0 0 30px #0cf,0 0 80px #0cf,0 0 160px rgba(0,200,255,.3);margin-bottom:.28em;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 30px #0cf,0 0 80px #0cf,0 0 160px rgba(0,200,255,.3)}50%{text-shadow:0 0 20px #0cf,0 0 50px #0cf}}
.sub{font-size:clamp(9px,1.5vw,12px);letter-spacing:.24em;color:rgba(255,255,255,.32);margin-bottom:.5em}
.hint{font-size:clamp(8px,1.1vw,10px);letter-spacing:.14em;color:rgba(255,255,255,.16);margin-bottom:2.8em}
.btn{background:transparent;border:1px solid rgba(0,200,255,.5);color:#0cf;font-family:'Orbitron',monospace;font-size:clamp(9px,1.4vw,12px);letter-spacing:.22em;padding:13px 46px;cursor:pointer;transition:all .22s;pointer-events:all}
.btn:hover{background:rgba(0,200,255,.12);border-color:#0cf;box-shadow:0 0 28px rgba(0,200,255,.22)}
.final-score{font-size:clamp(16px,3vw,26px);color:#0cf;letter-spacing:.18em;margin-bottom:.35em}
.best-line{font-size:10px;color:rgba(255,255,255,.25);letter-spacing:.18em;margin-bottom:.2em}
.new-best{font-size:10px;color:#ff0;letter-spacing:.2em;margin-bottom:2.5em;animation:glow2 1s ease-in-out infinite}
@keyframes glow2{0%,100%{opacity:1}50%{opacity:.4}}
.no-new{margin-bottom:2.5em}

/* UPGRADE CARDS */
.upg-title{font-size:clamp(12px,2vw,16px);letter-spacing:.2em;color:rgba(255,255,255,.5);margin-bottom:2em}
.upg-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:760px;padding:0 20px}
.upg-card{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);
  padding:22px 20px;cursor:pointer;transition:all .2s;pointer-events:all;
  width:180px;text-align:center;position:relative;
}
.upg-card:hover{background:rgba(255,255,255,.08);transform:translateY(-3px)}
.upg-card .upg-icon{font-size:28px;margin-bottom:10px;display:block}
.upg-card .upg-name{font-size:11px;font-weight:700;letter-spacing:.2em;margin-bottom:8px}
.upg-card .upg-desc{font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.4);line-height:1.7}
.upg-card .upg-lvl{position:absolute;top:8px;right:10px;font-size:8px;color:rgba(255,255,255,.25);letter-spacing:.1em}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" style="display:none">
  <div id="score-wrap">
    <div id="score-label">SCORE</div>
    <div id="score-val">0</div>
    <div style="height:4px"></div>
    <div id="hi-label">BEST</div>
    <div id="hi-val">0</div>
  </div>
  <div id="lives-wrap"></div>
  <div id="wave-wrap">
    <div id="wave-label">WAVE</div>
    <div id="wave-val">1</div>
  </div>
  <div id="upgrades-wrap"></div>
  <div id="controls-hint">WASD / ARROWS · MOVE<br>MOUSE · STEER<br>SPACE · SHOOT*</div>
</div>

<!-- MENU -->
<div class="overlay" id="menu-overlay">
  <div class="big-title">VOID</div>
  <div class="sub">SURVIVE THE ASTEROID FIELD</div>
  <div class="hint">WASD / ARROWS / MOUSE &nbsp;·&nbsp; COLLECT ORBS &nbsp;·&nbsp; AVOID ASTEROIDS<br><br>EVERY 5 ORBS → CHOOSE AN UPGRADE</div>
  <button class="btn" onclick="startGame()">LAUNCH</button>
</div>

<!-- GAME OVER -->
<div class="overlay" id="gameover-overlay">
  <div class="big-title" style="font-size:clamp(34px,7vw,72px)">GAME OVER</div>
  <div class="final-score" id="go-score"></div>
  <div class="best-line" id="go-best"></div>
  <div id="go-newbest" class="new-best" style="display:none">✦ NEW BEST ✦</div>
  <div id="go-nonewbest" class="no-new"></div>
  <button class="btn" onclick="startGame()">RETRY</button>
</div>

<!-- UPGRADE PICKER -->
<div class="overlay" id="upgrade-overlay">
  <div class="upg-title">— CHOOSE AN UPGRADE —</div>
  <div class="upg-cards" id="upg-cards"></div>
</div>

<script>
// ─── CANVAS ───────────────────────────────────────────────────
const C=document.getElementById('c'),ctx=C.getContext('2d');
let W,H,mx,my,lastTime=0,elapsed=0;
let gameState='menu'; // menu playing upgrade gameover

// ─── GAME STATE ───────────────────────────────────────────────
let score=0,wave=1,lives=3,orbsCollected=0;
let hiScore=parseInt(localStorage.getItem('void-hi')||'0');
let ship,particles=[],asteroids=[],orbs=[],explo=[],bullets=[],stars=[];
let aTick=0,oTick=0;
const keys={};

// ─── UPGRADES ─────────────────────────────────────────────────
const UPGRADE_DEFS = [
  {id:'magnet',  name:'MAGNET',   icon:'◎', color:'#0cf', desc:'Orbs fly toward you',         max:1},
  {id:'shield',  name:'SHIELD',   icon:'⬡', color:'#c0f', desc:'Absorbs 1 extra hit',          max:3},
  {id:'velocity',name:'VELOCITY', icon:'▶', color:'#ff0', desc:'Ship speed +25%',              max:4},
  {id:'bounty',  name:'BOUNTY',   icon:'◆', color:'#0f8', desc:'Orbs worth double points',     max:1},
  {id:'frost',   name:'FROST',    icon:'✦', color:'#8df', desc:'Asteroids move 18% slower',    max:3},
  {id:'turret',  name:'TURRET',   icon:'▲', color:'#f80', desc:'SPACE / click to shoot',       max:1},
  {id:'repair',  name:'REPAIR',   icon:'♥', color:'#f44', desc:'Restore 1 life (instant)',     max:99},
  {id:'ghost',   name:'GHOST',    icon:'◌', color:'#aaf', desc:'Longer invincibility window',  max:2},
];
let activeUpgrades={}; // id -> level

function upgLevel(id){return activeUpgrades[id]||0;}

// ─── INPUT ────────────────────────────────────────────────────
function resize(){
  W=C.width=window.innerWidth;H=C.height=window.innerHeight;
  mx=W/2;my=H/2;genStars();
}
function genStars(){
  stars=[];
  const n=Math.floor(W*H/6500);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.2+Math.random()*1.3,a:.07+Math.random()*.55,t:Math.random()*Math.PI*2,s:.25+Math.random()*.6});
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
window.addEventListener('touchmove',e=>{e.preventDefault();mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:false});
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();fireBullet();}
});
window.addEventListener('keyup',e=>keys[e.code]=false);
C.addEventListener('click',()=>{ if(gameState==='playing') fireBullet(); });

// ─── SHIP ─────────────────────────────────────────────────────
function initShip(){
  ship={x:W/2,y:H/2,vx:0,vy:0,angle:-Math.PI/2,r:13,inv:0,trail:[],shieldHp:0};
}

// ─── SPAWNERS ─────────────────────────────────────────────────
function spawnAsteroid(){
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W;y=-60;}
  else if(edge===1){x=W+60;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+60;}
  else{x=-60;y=Math.random()*H;}
  const frostMult=1-upgLevel('frost')*.18;
  const spd=(1+Math.random()*.9)*(1+wave*.1)*frostMult;
  const ang=Math.atan2((ship.y-y)+(Math.random()-.5)*280,(ship.x-x)+(Math.random()-.5)*280);
  const sides=5+Math.floor(Math.random()*4);
  const r=15+Math.random()*22;
  const verts=[];
  for(let i=0;i<sides;i++){const a=(i/sides)*Math.PI*2;verts.push({x:Math.cos(a)*r*(.58+Math.random()*.42),y:Math.sin(a)*r*(.58+Math.random()*.42)});}
  asteroids.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r,verts,rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.026,hp:1});
}

function spawnOrb(){
  const m=90;
  orbs.push({x:m+Math.random()*(W-m*2),y:m+Math.random()*(H-m*2),r:7,p:Math.random()*Math.PI*2});
}

function fireBullet(){
  if(!upgLevel('turret'))return;
  if(gameState!=='playing')return;
  bullets.push({x:ship.x,y:ship.y,vx:Math.cos(ship.angle)*14,vy:Math.sin(ship.angle)*14,life:1});
}

// ─── PARTICLES ────────────────────────────────────────────────
function explode(x,y,col,n=22){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=.4+Math.random()*3.8;
    explo.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:1+Math.random()*3,col});
  }
}

// ─── UTILS ────────────────────────────────────────────────────
function dst(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// ─── HUD ──────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('score-val').textContent=score;
  document.getElementById('hi-val').textContent=hiScore;
  document.getElementById('wave-val').textContent=wave;
  // Lives
  const lw=document.getElementById('lives-wrap');lw.innerHTML='';
  const total=3+upgLevel('shield');
  for(let i=0;i<Math.max(lives,3);i++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 22 22');s.setAttribute('width','17');s.setAttribute('height','17');
    const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    p.setAttribute('points','11,2 19,20 11,15 3,20');
    const alive=i<lives;
    p.setAttribute('fill',alive?'#0cf':'rgba(255,255,255,.1)');
    if(alive)p.setAttribute('filter','drop-shadow(0 0 5px #0cf)');
    s.appendChild(p);lw.appendChild(s);
  }
  // Active upgrades
  const uw=document.getElementById('upgrades-wrap');uw.innerHTML='';
  for(const [id,lvl] of Object.entries(activeUpgrades)){
    if(!lvl)continue;
    const def=UPGRADE_DEFS.find(u=>u.id===id);
    if(!def||id==='repair')continue;
    const pip=document.createElement('div');
    pip.className='upg-pip';
    pip.style.color=def.color;pip.style.borderColor=def.color+'55';
    pip.textContent=def.icon+' '+def.name+(lvl>1?' '+lvl:'');
    uw.appendChild(pip);
  }
}

// ─── UPGRADE SYSTEM ───────────────────────────────────────────
function triggerUpgrades(){
  gameState='upgrade';
  document.getElementById('upgrade-overlay').style.display='flex';
  const pool=UPGRADE_DEFS.filter(u=>(activeUpgrades[u.id]||0)<u.max);
  const shuffled=pool.sort(()=>Math.random()-.5).slice(0,3);
  const container=document.getElementById('upg-cards');
  container.innerHTML='';
  for(const u of shuffled){
    const card=document.createElement('div');
    card.className='upg-card';
    card.style.borderColor=u.color+'40';
    const lvl=(activeUpgrades[u.id]||0)+1;
    card.innerHTML=`
      <span class="upg-icon" style="color:${u.color};text-shadow:0 0 12px ${u.color}">${u.icon}</span>
      <div class="upg-name" style="color:${u.color}">${u.name}</div>
      <div class="upg-desc">${u.desc}</div>
      ${lvl>1?`<div class="upg-lvl">LVL ${lvl}</div>`:''}
    `;
    card.onclick=()=>applyUpgrade(u.id);
    container.appendChild(card);
  }
}

function applyUpgrade(id){
  activeUpgrades[id]=(activeUpgrades[id]||0)+1;
  if(id==='repair'){lives=Math.min(lives+1,6);}
  if(id==='shield'){ship.shieldHp=(ship.shieldHp||0)+1;}
  document.getElementById('upgrade-overlay').style.display='none';
  gameState='playing';
  updateHUD();
  requestAnimationFrame(loop);
}

// ─── GAME OVER ────────────────────────────────────────────────
function gameOver(){
  gameState='gameover';
  const isNew=score>hiScore;
  if(isNew){hiScore=score;localStorage.setItem('void-hi',hiScore);}
  document.getElementById('go-score').textContent='SCORE — '+score;
  document.getElementById('go-best').textContent='BEST — '+hiScore;
  document.getElementById('go-newbest').style.display=isNew?'block':'none';
  document.getElementById('go-nonewbest').style.display=isNew?'none':'block';
  document.getElementById('gameover-overlay').style.display='flex';
}

// ─── START ────────────────────────────────────────────────────
function startGame(){
  score=0;wave=1;lives=3;elapsed=0;aTick=0;oTick=0;orbsCollected=0;
  activeUpgrades={};particles=[];asteroids=[];orbs=[];explo=[];bullets=[];
  initShip();mx=W/2;my=H/2;
  document.getElementById('menu-overlay').style.display='none';
  document.getElementById('gameover-overlay').style.display='none';
  document.getElementById('upgrade-overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('controls-hint').style.display='block';
  updateHUD();gameState='playing';
  requestAnimationFrame(loop);
}

// ─── MAIN LOOP ────────────────────────────────────────────────
function loop(ts){
  if(gameState!=='playing')return;
  const dt=Math.min((ts-lastTime)/1000,.05);
  lastTime=ts;elapsed+=dt;
  wave=Math.floor(elapsed/18)+1;

  // Clear
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Stars
  for(const s of stars){
    s.t+=dt*s.s;
    ctx.globalAlpha=s.a*(.65+.35*Math.sin(s.t));
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // ── SHIP MOVEMENT ──
  const velScale=1+upgLevel('velocity')*.25;
  const accel=.22*velScale;
  if(keys['KeyA']||keys['ArrowLeft']) ship.vx-=accel;
  if(keys['KeyD']||keys['ArrowRight'])ship.vx+=accel;
  if(keys['KeyW']||keys['ArrowUp'])   ship.vy-=accel;
  if(keys['KeyS']||keys['ArrowDown']) ship.vy+=accel;

  // Mouse attraction
  const ddx=mx-ship.x,ddy=my-ship.y,dd=Math.hypot(ddx,ddy);
  if(dd>10){
    const pull=Math.min(dd,130)*.0085*velScale;
    ship.vx+=ddx/dd*pull*dt*60;
    ship.vy+=ddy/dd*pull*dt*60;
  }
  // Update angle toward motion
  const spd=Math.hypot(ship.vx,ship.vy);
  if(spd>.3)ship.angle=Math.atan2(ship.vy,ship.vx);

  ship.vx*=.91;ship.vy*=.91;
  ship.x+=ship.vx*dt*60*.55;ship.y+=ship.vy*dt*60*.55;
  if(ship.x<-30)ship.x=W+30;else if(ship.x>W+30)ship.x=-30;
  if(ship.y<-30)ship.y=H+30;else if(ship.y>H+30)ship.y=-30;

  // Trail
  ship.trail.unshift({x:ship.x,y:ship.y});
  if(ship.trail.length>30)ship.trail.pop();
  for(let i=0;i<ship.trail.length;i++){
    const t=ship.trail[i],f=1-i/ship.trail.length;
    ctx.globalAlpha=f*.3;
    ctx.shadowBlur=7;ctx.shadowColor='#0cf';
    ctx.fillStyle=`hsl(${185+i*1.2},100%,${52+f*20}%)`;
    ctx.beginPath();ctx.arc(t.x,t.y,2.4*f,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // ── SPAWN ──
  aTick+=dt;
  const aInterval=Math.max(.3,1.55-wave*.065);
  if(aTick>aInterval){aTick=0;spawnAsteroid();if(wave>3)spawnAsteroid();}
  oTick+=dt;
  if(oTick>3.5&&orbs.length<7){oTick=0;spawnOrb();}

  // ── ORBS ──
  const magnet=upgLevel('magnet');
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];o.p+=dt*2.5;
    if(magnet){
      const od=dst(ship,o);if(od<220){const f=14/od;o.x+=(ship.x-o.x)*f*dt*60*.05;o.y+=(ship.y-o.y)*f*dt*60*.05;}
    }
    const pr=o.r+Math.sin(o.p)*2.5;
    if(dst(ship,o)<ship.r+pr+2){
      const pts=upgLevel('bounty')?20:10;
      score+=pts;orbsCollected++;
      explode(o.x,o.y,'rgba(0,255,140,1)',18);
      orbs.splice(i,1);
      if(orbsCollected%5===0)triggerUpgrades();
      else updateHUD();
      if(gameState!=='playing')return;
      continue;
    }
    // Draw orb
    ctx.save();
    ctx.globalAlpha=.16+.1*Math.sin(o.p);
    ctx.strokeStyle='#0f8';ctx.lineWidth=1;
    ctx.shadowBlur=12;ctx.shadowColor='#0f8';
    ctx.beginPath();ctx.arc(o.x,o.y,pr*2.1,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=.92;
    ctx.shadowBlur=18;ctx.shadowColor='#0f8';
    const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,pr*1.5);
    g.addColorStop(0,'rgba(180,255,215,1)');g.addColorStop(.4,'rgba(0,255,130,.8)');g.addColorStop(1,'rgba(0,200,100,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,pr*1.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // ── BULLETS ──
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt*60*.55;b.y+=b.vy*dt*60*.55;
    b.life-=dt*1.2;
    if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){bullets.splice(i,1);continue;}
    // Hit asteroid?
    let hit=false;
    for(let j=asteroids.length-1;j>=0;j--){
      if(dst(b,asteroids[j])<asteroids[j].r*.8){
        explode(asteroids[j].x,asteroids[j].y,'rgba(200,200,255,1)',14);
        asteroids.splice(j,1);bullets.splice(i,1);hit=true;score+=5;updateHUD();break;
      }
    }
    if(hit)continue;
    ctx.save();
    ctx.globalAlpha=b.life*.9;
    ctx.shadowBlur=12;ctx.shadowColor='#f80';
    ctx.fillStyle='#ffa040';
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // ── ASTEROIDS ──
  for(let i=asteroids.length-1;i>=0;i--){
    const a=asteroids[i];
    a.x+=a.vx*dt*60*.52;a.y+=a.vy*dt*60*.52;a.rot+=a.rs;
    if(a.x<-260||a.x>W+260||a.y<-260||a.y>H+260){asteroids.splice(i,1);continue;}
    // Collision with ship
    if(ship.inv<=0&&dst(ship,a)<ship.r+a.r*.7){
      explode(ship.x,ship.y,'rgba(255,80,80,1)');
      if(ship.shieldHp>0){
        ship.shieldHp--;explode(ship.x,ship.y,'rgba(200,0,255,.8)',10);
      } else {
        lives--;updateHUD();
        if(lives<=0){gameOver();return;}
      }
      const ghostMult=1+upgLevel('ghost')*.6;
      ship.inv=2.5*ghostMult;
      ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;mx=W/2;my=H/2;ship.trail=[];
    }
    // Draw
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
    ctx.shadowBlur=5;ctx.shadowColor='rgba(160,160,220,.3)';
    ctx.fillStyle='rgba(16,16,36,.88)';ctx.strokeStyle='rgba(150,150,210,.72)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(a.verts[0].x,a.verts[0].y);
    for(let j=1;j<a.verts.length;j++)ctx.lineTo(a.verts[j].x,a.verts[j].y);
    ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  }

  // ── EXPLO PARTICLES ──
  for(let i=explo.length-1;i>=0;i--){
    const p=explo[i];
    p.x+=p.vx*dt*60*.48;p.y+=p.vy*dt*60*.48;p.vx*=.96;p.vy*=.96;p.life-=dt*1.7;
    if(p.life<=0){explo.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=p.life*.88;ctx.shadowBlur=9;ctx.shadowColor=p.col;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // ── SHIP DRAW ──
  const blinking=ship.inv>0&&Math.floor(ship.inv*7)%2===0;
  if(!blinking){
    ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle+Math.PI/2);
    // Shield ring
    if(ship.shieldHp>0){
      ctx.save();
      ctx.globalAlpha=.35+.2*Math.sin(elapsed*4);
      ctx.strokeStyle='#c0f';ctx.lineWidth=1.5;ctx.shadowBlur=16;ctx.shadowColor='#c0f';
      ctx.beginPath();ctx.arc(0,0,ship.r*1.7,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur=22;ctx.shadowColor='rgba(0,200,255,.8)';
    ctx.fillStyle='#e8f4ff';ctx.strokeStyle='#0cf';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(0,-ship.r*1.1);ctx.lineTo(ship.r*.72,ship.r*.85);ctx.lineTo(0,ship.r*.38);ctx.lineTo(-ship.r*.72,ship.r*.85);ctx.closePath();
    ctx.fill();ctx.stroke();
    if(spd>.4){
      ctx.shadowBlur=14;ctx.shadowColor='#0cf';ctx.fillStyle='rgba(0,185,255,.68)';
      ctx.beginPath();ctx.moveTo(-ship.r*.27,ship.r*.38);ctx.lineTo(0,ship.r*.92+Math.random()*7);ctx.lineTo(ship.r*.27,ship.r*.38);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  if(ship.inv>0)ship.inv-=dt;

  // ── TURRET AIM LINE ──
  if(upgLevel('turret')&&!blinking){
    ctx.save();ctx.globalAlpha=.18;ctx.strokeStyle='#f80';ctx.lineWidth=1;ctx.setLineDash([4,8]);
    ctx.beginPath();ctx.moveTo(ship.x,ship.y);ctx.lineTo(ship.x+Math.cos(ship.angle)*300,ship.y+Math.sin(ship.angle)*300);ctx.stroke();ctx.restore();
  }

  updateHUD();
  requestAnimationFrame(loop);
}

// ── MENU BACKGROUND ──
function menuLoop(ts){
  if(gameState!=='menu')return;
  lastTime=ts;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(const s of stars){s.t+=.0025;ctx.globalAlpha=s.a*(.65+.35*Math.sin(s.t));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  requestAnimationFrame(menuLoop);
}

resize();
document.getElementById('hi-val').textContent=hiScore;
requestAnimationFrame(menuLoop);
</script>
</body>
</html>
